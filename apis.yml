name: Solestial
description: Solestial is a space solar energy company developing space-stable silicon photovoltaics
  — radiation-hardened, ultrathin flexible silicon heterojunction solar cells and modules for spacecraft.
  Its products are the only solar products on the market that self-cure radiation damage at operating
  temperatures, offering competitive performance at lower cost than III-V multijunction solar. Solestial
  has flight heritage across multiple spacecraft and works with customers including NASA, Boeing, and
  the U.S. Space Force. This is a hardware and manufacturing company with no public developer API surface.
